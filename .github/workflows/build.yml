name: Build

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Unzip
    types:
      - completed
    branches:
      - master
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: yiha-build-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Confirm source artifact or manual request
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check whether an uploaded ZIP was processed
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif [[ "$SOURCE_RESULT" != 'success' ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            # Deleting a ZIP manually can match the push path filter. Such a
            # no-op Unzip run has no artifact and must not start a build.
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "yiha-ready-source" and .expired == false)] | length')"
            if (( count > 0 )); then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            else
              echo 'No extracted source artifact; skipping Build.'
              echo 'ready=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: prepare
    name: Build (successful Unzip or manual)
    if: >-
      ${{ needs.prepare.outputs.ready == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download source from successful Unzip run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: yiha-ready-source
          path: src
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Checkout selected branch for manual Build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          path: src
          persist-credentials: false

      - name: Verify source commit and required files
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          MANUAL_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [[ "$MANUAL_BUILD" != "true" ]]; then
            test -f src/.source-commit
            test "$(cat src/.source-commit)" = "$EXPECTED_SHA"
          fi
          test -f src/gradlew
          test -f src/settings.gradle.kts
          test -f src/build.gradle.kts
          test -f src/gradle/wrapper/gradle-wrapper.jar
          echo "Building validated commit: $EXPECTED_SHA"

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle.kts
            src/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          # Do not request the removed legacy Android SDK package named 'tools'.
          packages: 'platform-tools'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      # JitPack's CloudStream Gradle plugin POM is missing in the failed run.
      # Publish the upstream plugin from its source to Maven Local instead.
      - name: Checkout official CloudStream Gradle plugin
        uses: actions/checkout@v7
        with:
          repository: recloudstream/gradle
          ref: master
          path: cloudstream-gradle
          persist-credentials: false

      - name: Build and publish CloudStream Gradle plugin locally
        working-directory: cloudstream-gradle
        shell: bash
        run: |
          set -euo pipefail
          # This is a temporary CI-only version; no upstream files are committed.
          printf '\nversion = "yiha-local"\n' >> build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon publishToMavenLocal
          plugin_dir="$HOME/.m2/repository/com/lagradost/cloudstream3/gradle/yiha-local"
          test -s "$plugin_dir/gradle-yiha-local.jar"
          test -s "$plugin_dir/gradle-yiha-local.pom"
          echo "CloudStream Gradle plugin built locally: $plugin_dir"

      - name: Build CloudStream plugins
        working-directory: src
        env:
          YIHA_LOCAL_CLOUDSTREAM_GRADLE: 'true'
          DUBBINDO_PASSWORD: ${{ secrets.DUBBINDO_PASS }}
          DUBBINDO_USERNAME: ${{ secrets.DUBBINDO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson
          test -s build/plugins.json
          python3 -m json.tool build/plugins.json > /dev/null
          if ! find . -type f -path '*/build/*.cs3' -print -quit | grep -q .; then
            echo 'ERROR: Gradle produced no .cs3 files.' >&2
            exit 1
          fi

      - name: Checkout builds branch
        uses: actions/checkout@v7
        with:
          ref: builds
          path: builds
          persist-credentials: true

      - name: Publish CloudStream plugins
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          rm -f builds/*.cs3 builds/*.jar
          while IFS= read -r -d '' plugin; do
            cp "$plugin" builds/
          done < <(find src -type f -path '*/build/*.cs3' -print0)
          cp src/build/plugins.json builds/plugins.json

          cd builds
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -A
          if git diff --staged --quiet; then
            echo 'No build changes to publish.'
            exit 0
          fi
          git commit -m "Build $SOURCE_SHA"
          git push origin HEAD:builds
