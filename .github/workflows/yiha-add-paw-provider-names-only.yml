name: Yiha Add Paw To Provider Names

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yiha-provider-paw-names
  cancel-in-progress: false

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add paw to Provider.kt names only
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from pathlib import Path

          files = sorted(Path(".").rglob("*Provider.kt"))
          if not files:
              raise SystemExit("No *Provider.kt files found.")

          pattern = re.compile(
              r'(^\s*override\s+var\s+name\s*=\s*")([^"\n]+)(")',
              re.MULTILINE,
          )

          changed = []
          total_names = 0

          for path in files:
              text = path.read_text(encoding="utf-8")

              def repl(match):
                  nonlocal_name = match.group(2).strip()

                  # Replace old ninja suffix if present.
                  if nonlocal_name.endswith("🥷"):
                      updated = nonlocal_name[:-1].rstrip() + " 🐾"
                  # Do not duplicate paw suffix.
                  elif nonlocal_name.endswith("🐾"):
                      updated = nonlocal_name
                  else:
                      updated = nonlocal_name + " 🐾"

                  return match.group(1) + updated + match.group(3)

              matches = list(pattern.finditer(text))
              total_names += len(matches)

              new_text = pattern.sub(repl, text)

              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  changed.append(str(path))

          if total_names == 0:
              raise SystemExit("No override var name declarations found in *Provider.kt.")

          print(f"Found {total_names} provider name declarations.")
          print(f"Changed {len(changed)} Provider.kt files.")

          for path in changed:
              print(f"  {path}")
          PY

          git diff --check

          BAD="$(git diff --name-only | grep -vE '(^|/)[^/]*Provider\.kt$' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::Unexpected modified files:"
            echo "$BAD"
            exit 1
          fi

          git diff -- '*Provider.kt'

      - name: Verify all Provider.kt names end with paw
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(
              r'^\s*override\s+var\s+name\s*=\s*"([^"\n]+)"',
              re.MULTILINE,
          )

          found = []
          bad = []

          for path in sorted(Path(".").rglob("*Provider.kt")):
              text = path.read_text(encoding="utf-8")
              for name in pattern.findall(text):
                  found.append((str(path), name))
                  if not name.strip().endswith("🐾"):
                      bad.append((str(path), name))

          if not found:
              raise SystemExit("No provider name declarations found.")

          if bad:
              lines = "\n".join(f"{p}: {n}" for p, n in bad[:50])
              raise SystemExit(
                  "Some Provider.kt names are missing 🐾:\n" + lines
              )

          print(f"Verified {len(found)} provider names ending with 🐾.")
          PY

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Build repository
        env:
          DUBBINDO_PASSWORD: ${{ secrets.DUBBINDO_PASS }}
          DUBBINDO_USERNAME: ${{ secrets.DUBBINDO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Commit Provider.kt changes only
        shell: bash
        run: |
          set -euo pipefail

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          find . -type f -name '*Provider.kt' -print0 | xargs -0 git add --

          if git diff --staged --quiet; then
            echo "All Provider.kt names already use 🐾."
          else
            git commit -m "Add paw suffix to provider names"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
