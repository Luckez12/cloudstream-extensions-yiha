name: Yiha Stage 1 Fork Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yiha-stage1-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch fork identity
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          repo_path = Path("repo.json")
          repo = json.loads(repo_path.read_text(encoding="utf-8"))

          repo["name"] = "Yiha Extensions"
          repo["iconUrl"] = "https://github.com/Luckez12.png"
          repo["description"] = (
              "CloudStream extensions maintained by Luckez. "
              "Forked from HatsuneMikuUwU/cloudstream-extensions-uwu."
          )
          repo["manifestVersion"] = 1
          repo["pluginLists"] = [
              "https://raw.githubusercontent.com/Luckez12/cloudstream-extensions-yiha/builds/plugins.json"
          ]

          repo_path.write_text(
              json.dumps(repo, indent=4, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          gradle_path = Path("build.gradle.kts")
          gradle = gradle_path.read_text(encoding="utf-8")

          upstream = "https://github.com/HatsuneMikuUwU/cloudstream-extensions-uwu"
          fork = "https://github.com/Luckez12/cloudstream-extensions-yiha"

          old = f'setRepo(System.getenv("GITHUB_REPOSITORY") ?: "{upstream}")'
          new = f'setRepo(System.getenv("GITHUB_REPOSITORY") ?: "{fork}")'

          if old in gradle:
              gradle = gradle.replace(old, new, 1)
          elif new not in gradle:
              raise SystemExit("Could not locate expected setRepo configuration.")

          if 'authors = listOf("Miku")' not in gradle:
              raise SystemExit("Expected Miku attribution was not found.")

          if 'namespace = "com.miku"' not in gradle:
              raise SystemExit("Expected upstream namespace was not found.")

          gradle_path.write_text(gradle, encoding="utf-8")

          readme_lines = [
              "# Yiha Extensions",
              "",
              "A maintained fork of `HatsuneMikuUwU/cloudstream-extensions-uwu`.",
              "",
              "## Maintenance",
              "",
              "- Maintainer: **Luckez**",
              "- Upstream: **HatsuneMikuUwU/cloudstream-extensions-uwu**",
              "- Original provider authorship remains credited to the original authors.",
              "- The `builds` branch is generated from this fork and contains CloudStream plugin artefacts.",
              "",
              "## Attribution",
              "",
              "This fork preserves upstream Git history and author attribution.",
              "Changes made specifically for this fork are maintained by **Luckez**.",
              "",
          ]
          Path("README.md").write_text(
              "\n".join(readme_lines),
              encoding="utf-8",
          )
          PY

          git diff --check

      - name: Commit identity files only
        shell: bash
        run: |
          set -euo pipefail

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Intentionally do not stage any file under .github/workflows/.
          git add repo.json build.gradle.kts README.md

          if git diff --staged --quiet; then
            echo "Identity files are already applied."
          else
            git commit -m "Bootstrap Yiha fork identity [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Build fork plugins
        env:
          DUBBINDO_PASSWORD: ${{ secrets.DUBBINDO_PASS }}
          DUBBINDO_USERNAME: ${{ secrets.DUBBINDO_USER }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Verify generated manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          manifest = Path("build/plugins.json")
          if not manifest.is_file():
              raise SystemExit("build/plugins.json was not generated.")

          plugins = json.loads(manifest.read_text(encoding="utf-8"))
          if not isinstance(plugins, list) or not plugins:
              raise SystemExit("plugins.json is empty or invalid.")

          expected_raw = (
              "https://raw.githubusercontent.com/"
              "Luckez12/cloudstream-extensions-yiha/builds/"
          )
          expected_repo = "https://github.com/Luckez12/cloudstream-extensions-yiha"

          errors = []

          for plugin in plugins:
              name = plugin.get("name", "<unknown>")
              url = str(plugin.get("url", ""))
              repository_url = str(plugin.get("repositoryUrl", ""))

              if not url.startswith(expected_raw):
                  errors.append(f"{name}: wrong cs3 URL: {url}")

              if repository_url != expected_repo:
                  errors.append(
                      f"{name}: wrong repositoryUrl: {repository_url}"
                  )

          if errors:
              raise SystemExit("\n".join(errors[:20]))

          print(f"Verified {len(plugins)} plugin entries.")
          PY

      - name: Collect build artefacts
        shell: bash
        run: |
          set -euo pipefail

          OUT="${RUNNER_TEMP}/yiha-build-output"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          find . -path '*/build/*.cs3' -type f -exec cp {} "$OUT/" \;
          find . -path '*/build/*.jar' -type f -exec cp {} "$OUT/" \;
          cp build/plugins.json "$OUT/plugins.json"

          CS3_COUNT="$(find "$OUT" -maxdepth 1 -name '*.cs3' -type f | wc -l)"

          if [ "$CS3_COUNT" -eq 0 ]; then
            echo "::error::No .cs3 artefacts were produced."
            exit 1
          fi

          echo "Prepared ${CS3_COUNT} .cs3 artefacts."
          ls -lah "$OUT"

      - name: Replace builds branch with clean artefact tree
        shell: bash
        run: |
          set -euo pipefail

          OUT="${RUNNER_TEMP}/yiha-build-output"
          WORKTREE="${RUNNER_TEMP}/yiha-builds-worktree"

          rm -rf "$WORKTREE"

          if git ls-remote --exit-code --heads origin builds >/dev/null 2>&1; then
            git fetch origin builds
            git worktree add --detach "$WORKTREE" origin/builds
            cd "$WORKTREE"
            git rm -rf . >/dev/null 2>&1 || true
          else
            mkdir -p "$WORKTREE"
            cd "$WORKTREE"
            git init
            git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
            git checkout --orphan builds
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          cp "$OUT"/* .

          git add -f plugins.json *.cs3

          if compgen -G "*.jar" > /dev/null; then
            git add -f *.jar
          fi

          if git diff --cached --quiet; then
            echo "Build artefacts are unchanged."
          else
            git commit -m "Yiha build ${GITHUB_SHA}"
            git push origin HEAD:builds --force
          fi

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          WORKTREE="${RUNNER_TEMP}/yiha-builds-worktree"

          test -f "$WORKTREE/plugins.json"
          test "$(find "$WORKTREE" -maxdepth 1 -name '*.cs3' -type f | wc -l)" -gt 0

          EXTRA="$(find "$WORKTREE" -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'plugins.json' \
            ! -name '*.cs3' \
            ! -name '*.jar' \
            -print)"

          if [ -n "$EXTRA" ]; then
            echo "::error::Unexpected files remain in builds branch:"
            echo "$EXTRA"
            exit 1
          fi

          echo "Yiha Stage 1 bootstrap completed successfully."
