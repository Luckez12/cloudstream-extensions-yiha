name: Sync Common Folders from AnimeX

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yiha-folder-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    # The Yiha source branch is master; never write into the builds branch.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Yiha
        uses: actions/checkout@v4
        with:
          path: yiha

      - name: Checkout AnimeX upstream
        uses: actions/checkout@v4
        with:
          repository: HatsuneMikuUwU/AnimeX
          ref: master
          path: upstream
          persist-credentials: false

      - name: Sync folders that exist in both repositories
        shell: bash
        run: |
          set -euo pipefail

          # Compare top-level directories tracked in each repository.
          mapfile -t yiha_dirs < <(git -C yiha ls-tree -d --name-only HEAD)
          mapfile -t upstream_dirs < <(git -C upstream ls-tree -d --name-only HEAD)

          declare -A upstream_has=()
          for folder in "${upstream_dirs[@]}"; do
            upstream_has["$folder"]=1
          done

          matched=()
          for folder in "${yiha_dirs[@]}"; do
            [[ -n "${upstream_has[$folder]+yes}" ]] || continue

            # Protect custom workflows and build infrastructure.
            case "$folder" in
              .github|.git|.gradle|.vscode|.idea|gradle|build|builds|node_modules)
                continue
                ;;
              .*)
                continue
                ;;
            esac

            [[ -d "yiha/$folder" && -d "upstream/$folder" ]] || continue

            # --delete makes each selected folder mirror upstream, including deletions.
            rsync -a --checksum --delete -- "upstream/$folder/" "yiha/$folder/"
            matched+=("$folder")
            echo "Synced folder: $folder"
          done

          if (( ${#matched[@]} == 0 )); then
            echo "No matching source folders to sync."
            exit 0
          fi

          cd yiha
          git add -A -- "${matched[@]}"

          if git diff --cached --quiet; then
            echo "All matching folders are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync common source folders from AnimeX"
          git push origin "HEAD:${GITHUB_REF_NAME}"
