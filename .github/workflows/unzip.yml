name: Unzip

# Only uploading/updating ZIP files on the source branch starts this workflow.
on:
  push:
    branches:
      - master
      - main
    paths:
      - '*.zip'
      - '**/*.zip'
      - '*.ZIP'
      - '**/*.ZIP'

permissions:
  contents: write

concurrency:
  group: yiha-unzip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unzip:
    name: Extract ZIP, save source and remove ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the ZIP upload commit
        uses: actions/checkout@v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: true

      - name: Find newly uploaded or modified ZIP files
        id: incoming
        working-directory: src
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            mapfile -d '' changed < <(git ls-files -z)
          else
            mapfile -d '' changed < <(git diff --name-only -z --diff-filter=AMRT "$BEFORE_SHA" "$GITHUB_SHA")
          fi
          archives=()
          for file in "${changed[@]}"; do
            case "$file" in
              *.zip|*.ZIP)
                if [[ -f "$file" && ! -L "$file" ]]; then
                  archives+=("$file")
                fi
                ;;
            esac
          done
          if (( ${#archives[@]} == 0 )); then
            # A deletion matches GitHub's path filter too, but is not an upload.
            echo 'No newly added or modified ZIP exists. Nothing to unpack.'
            echo 'has_zip=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\0' "${archives[@]}" > "$RUNNER_TEMP/yiha-new-zips.list"
          printf 'has_zip=true\n' >> "$GITHUB_OUTPUT"
          printf 'Found %s ZIP file(s) to extract.\n' "${#archives[@]}"

      - name: Extract uploads into repository source
        if: steps.incoming.outputs.has_zip == 'true'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' archive; do
            echo "Unpacking: $archive"
            unzip -tq "$archive"
            staging="$(mktemp -d "$RUNNER_TEMP/yiha-unzip.XXXXXXXX")"
            source_dir="$(python3 - "$archive" "$staging" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          archive, output = sys.argv[1:]
          root = pathlib.Path(output)
          with zipfile.ZipFile(archive) as zf:
              for member in zf.infolist():
                  name = member.filename
                  parts = pathlib.PurePosixPath(name).parts
                  if (name.startswith('/') or '\\' in name or '..' in parts
                          or not parts
                          or stat.S_ISLNK(member.external_attr >> 16)):
                      raise SystemExit(f'Unsafe ZIP entry: {name!r}')
              zf.extractall(root)
          entries = [p for p in root.iterdir() if p.name != '__MACOSX']
          if (len(entries) == 1 and entries[0].is_dir()
                  and (entries[0] / 'settings.gradle.kts').is_file()
                  and (entries[0] / 'gradlew').is_file()):
              root = entries[0]
          print(root)
          PY
            )"
            # Merge newly extracted source; keep CI workflows and the patched root
            # build.gradle.kts intact. ZIPs are staging inputs, not project sources.
            rsync -a "$source_dir/" ./ \
              --exclude='/.git/' \
              --exclude='/.github/' \
              --exclude='/build.gradle.kts' \
              --exclude='.gradle/' \
              --exclude='build/' \
              --exclude='*.zip' \
              --exclude='*.ZIP'
            rm -rf "$staging"
          done < "$RUNNER_TEMP/yiha-new-zips.list"

      - name: Validate extracted project
        if: steps.incoming.outputs.has_zip == 'true'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          for required in gradlew settings.gradle.kts build.gradle.kts \
            gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            [[ -f "$required" ]] || { echo "Missing required project file: $required" >&2; exit 1; }
          done
          if ! find . -mindepth 2 -maxdepth 2 -type f -name build.gradle.kts \
            -print -quit | grep -q .; then
            echo 'No provider module with build.gradle.kts found.' >&2
            exit 1
          fi
          echo 'Source validated. Original ZIP files may now be removed.'

      - name: Upload validated extracted source for automatic Build
        if: steps.incoming.outputs.has_zip == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ready-src
          rsync -a src/ ready-src/ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='.gradle/' \
            --exclude='build/' \
            --exclude='*.zip' \
            --exclude='*.ZIP'
          printf '%s\n' "$GITHUB_SHA" > ready-src/.source-commit

      - name: Save source artifact
        if: steps.incoming.outputs.has_zip == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yiha-ready-source
          path: ready-src/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

      - name: Delete processed ZIPs and commit extracted sources
        if: steps.incoming.outputs.has_zip == 'true'
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' archive; do
            git rm -f -- "$archive"
          done < "$RUNNER_TEMP/yiha-new-zips.list"
          git add -A
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git commit -m 'Unzip uploaded source and remove processed ZIP files'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'Unzip is successful: source committed and uploaded ZIPs deleted.'
